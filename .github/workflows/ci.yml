name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only checks out and tests.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate food files
        run: npm run validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Third-party notices are served
        run: |
          test -s apps/web/dist/THIRD_PARTY_NOTICES.txt
          grep -q "SIL OPEN FONT LICENSE" apps/web/dist/THIRD_PARTY_NOTICES.txt
          grep -q "three" apps/web/dist/THIRD_PARTY_NOTICES.txt
          grep -q "^workbox-core " apps/web/dist/THIRD_PARTY_NOTICES.txt
      - name: Size budgets
        run: npm run budget -w @lifepeek/web
      - name: Browser tests (smoke + release-gate projects)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e -w @lifepeek/web
        env:
          CI: 'true'
