name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly: the WebKit and Firefox projects (report-only for their first week, qa-fixes §3.1).
  schedule:
    - cron: '30 20 * * *'

# Read-only token: CI only checks out and tests.
permissions:
  contents: read

# A new push to a branch or PR cancels its run still going (the nightly run has its own group).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# The nightly run is for the engines job only; every other job skips it.
jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate food files
        run: npm run validate
      # Prettier (T10, FP-9): `npm run format` fixes what this finds.
      - name: Formatting
        run: npm run format:check
      # Exports, components and store actions the app never uses (T10, B25).
      - name: Dead code
        run: npm run lint:dead
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Third-party notices are served
        run: |
          test -s apps/web/dist/THIRD_PARTY_NOTICES.txt
          grep -q "SIL OPEN FONT LICENSE" apps/web/dist/THIRD_PARTY_NOTICES.txt
          grep -q "three" apps/web/dist/THIRD_PARTY_NOTICES.txt
          node apps/web/scripts/check-shipped-notices.mjs
      # Every link in the built site resolves as Vercel serves it (vercel.json), each page has its
      # own head, sitemap and robots agree (T12b). Offline: outside addresses are checked by hand
      # with `npm run links -w @lifepeek/web -- --external`.
      - name: Links in the built site
        run: npm run links -w @lifepeek/web
      # Enforces /sim ≤ 190 KB, the Home ratchet (147 KB), Track A ≤ +1.0 KB (R66) and the precache of every lazy chunk.
      - name: Size budgets (and the Track A ledger)
        run: npm run budget -w @lifepeek/web
      # Report-only until the user gives the project email (B20, §4 gate): then add --enforce.
      - name: Placeholders in shipped text (report)
        run: npm run lint:placeholders -w @lifepeek/web

  # Browser tests in 3 shards (qa-fixes §3.7: Chromium ≤ 12 min). Each shard builds the e2e build
  # itself (playwright.config.ts webServer). The fps and CPU tests run alone in the perf job, so no
  # other test competes for the CPU while they count; the Track A projects (redlist, phone-small,
  # phone-560, phone-xs, tablet-portrait, landscape, projector-sizes, storage-blocked) report only.
  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (shard ${{ matrix.shard }}/3)
        run: npm run e2e -w @lifepeek/web -- --shard=${{ matrix.shard }}/3 --grep-invert "fps while playing|CPU per frame"
        env:
          CI: 'true'

  # The 30 fps report (6× CPU) and the absolute CPU per frame, alone on a runner.
  perf:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: fps and CPU per frame (report)
        run: npm run e2e -w @lifepeek/web -- --project=perf --no-deps
        env:
          CI: 'true'

  # The CPU regression gate (qa-fixes §3.4): the PR build against its base (the head of the branch
  # it merges into), interleaved, medians of main-thread time per frame. Gate: PR ≤ 1.10 × base +
  # 0.2 ms. Enforced since T10 (FP-9, B26): a PR over the gate, or a run that cannot measure,
  # fails the job.
  perf-ab:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Base build
        # The branch name through the environment, never pasted into the script.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git worktree add ../base "origin/$BASE_REF"
          cd ../base && npm ci && npm run build
      - name: PR build
        run: npm ci && npm run build
      - run: npx playwright install --with-deps chromium
      - name: CPU ratio, base vs PR
        run: |
          (cd ../base/apps/web && npx vite preview --port 4391 --strictPort &)
          (cd apps/web && npx vite preview --port 4392 --strictPort &)
          for i in $(seq 60); do curl -sf http://localhost:4391 >/dev/null && curl -sf http://localhost:4392 >/dev/null && break; sleep 1; done
          npm run cpu-ratio -w @lifepeek/web -- --base http://localhost:4391 --pr http://localhost:4392 --rounds 6 --ms 3000 --enforce

  # WebKit and Firefox (qa-fixes §3.1): on main and nightly, report-only for their first week.
  engines:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit firefox
      - name: WebKit and Firefox projects (report)
        run: npm run e2e -w @lifepeek/web -- --project=webkit-desktop --project=webkit-phone --project=firefox-desktop
        env:
          CI: 'true'
          E2E_ENGINES: '1'
      # The engine's slow suites at their full count (R68: `npm test` runs a fixed, smaller set): nightly only.
      - name: Engine tests, full count (nightly)
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        run: npm test -w @lifepeek/engine
        env:
          FULL: '1'
      # A 40-minute lesson on one page, for leaks (T7, report): nightly only.
      - name: Long lesson (report)
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        run: |
          npx playwright install --with-deps chromium
          npm run e2e -w @lifepeek/web -- --project=lesson
        env:
          CI: 'true'
          E2E_NIGHTLY: '1'
